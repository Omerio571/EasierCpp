<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasierCpp | Design Preview</title>
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <a class="skip" href="#screen">Skip to content</a>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>EasierCpp <small>Make Your Life Easier</small></div>
    <div class="actions"><span class="preview-label">Design preview</span><button id="theme" type="button">Dark mode</button></div>
  </header>
  <div class="shell">
    <aside>
      <p class="eyebrow">Navigation</p>
      <nav aria-label="Main navigation" id="navigation"></nav>
      <div class="sidebar-bottom" id="sidebar-bottom"></div>
    </aside>
    <main id="screen" tabindex="-1"></main>
  </div>
  <div id="tooltip" role="tooltip" hidden></div>
  <p class="sr-only" id="announcement" role="status"></p>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
